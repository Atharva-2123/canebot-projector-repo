name: "CaneBot Vending Machine 1"
connection:
  transport: mqtt
  server_url: "ssl://mqtt.ilyama.golain.io:8883"
  device_id: "CaneBot Vending Machine 1"
  root_topic: "/6541_b195/CaneBot Vending Machine 1"
  mqtt:
    keep_alive: 30s
    clean_session: false
    tls:
      ca_cert_path: /home/pi/projector/canebot-projector-repo/omega/certs/ca.crt
      client_cert_path: /home/pi/projector/canebot-projector-repo/omega/certs/device.crt
      client_key_path: /home/pi/projector/canebot-projector-repo/omega/certs/device.key
modules:
  required: [sqlite-replication, heartbeat]
security:
  # 1 MiB. This value is load-bearing in both directions.
  #
  # Too high and nothing splits: fitTelemetryBatch reads maxTelemetryBatchRows (4096) rows and
  # only binary-searches for a smaller chunk when the payload EXCEEDS this value. At 250 MB it
  # never did, so omega handed the broker one publish carrying 4096 step_dwells rows — about
  # 7 MB — and the connection was dropped ("use of closed network connection" / "publish was
  # broken by timeout"), eventually killing the process.
  #
  # Too low and throughput suffers, because most of the ~20 s a batch takes is fixed overhead
  # (round trip, ack, journal commit) rather than transfer: measured going from 151 to 427 rows
  # per batch, 2.8x the payload cost only 1.3x the time. So batch size is close to free and the
  # cap should sit as high as the broker tolerates.
  #
  # The broker's ceiling sits between these two, measured rather than assumed:
  #   262144 (256 KiB)  ~427 rows/batch, publishes cleanly
  #   1048576 (1 MiB)   rejected — "use of closed network connection", same as the 7 MB case
  # So 256 KiB it is. Anything above it needs a broker-side limit change, not a config edit;
  # 512 KiB is untested and would be the next probe if that throughput is ever worth a restart.
  #
  # At ~600 B/row — every row carries its column names, since the wire format is a per-row map
  # (wire/payloads.go TelemetryRow.Fields) — this is ~427 rows per batch, ~20 rows/sec.
  max_payload_bytes: 262144
  capabilities:
    sqlite-replication: true
    heartbeat: true
sqlite-replication:
  # The PROJECTOR'S OUTPUT, never the machine's own config.db — omega must not open the
  # controller's database. Matches -replica in linux/install-services.sh.
  source_db_path: /home/pi/projector/canebot-projector-repo/projector/canebot_replica.db
  # omega's own cursors, separate from the projector's projector_state.db.
  state_db_path: /home/pi/projector/canebot-projector-repo/omega/state.db
  flush_interval: 5s
  snapshot_on_first_run: true
  table_strategies:
    actuator_intervals:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, started_at_ms, ended_at_ms, duration_ms, order_id, src_id, revision, output_id, output_name, started_state, started_step, started_send_ok, ended_state, ended_step, ended_send_ok, fault_type, fault_message, fault_raised_at_ms, fault_cleared_at_ms, seq_index, recipe_id, is_production, cycle_result, date_utc]
    cip_runs:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, started_at_ms, ended_at_ms, duration_ms, order_id, completed, fault_count, date_utc]
    config_history:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, changed_at_ms, order_id, config_key, old_value, new_value, date_utc]
    cycles:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, started_at_ms, ended_at_ms, duration_ms, order_id, is_production, result, recipe_id, glass_count, terminal_state, terminal_step, fault_count, dominant_fault_type, first_fault_at_ms, last_fault_at_ms, fsm_event_count, step_event_count, state_transition_count, unique_state_count, outcome, bucket_1m_ms, bucket_5m_ms, bucket_15m_ms, date_utc]
    rollups:
      strategy: telemetry
      ts_column: event_ts
      # One table replaces hourly_rollups, daily_rollups, hourly_fault_counts and
      # hourly_step_stats: they differed only in grain and in what they grouped by.
      # Four fewer snapshot cursors is four fewer chances to hit the empty-table skip that
      # has already cost all of them once.
      include_columns: [id, event_ts, grain, bucket_start_ms, date_utc, dim_kind, dim_key, glasses, orders_started, orders_completed, orders_faulted, fault_count, cip_runs, cycle_ms_sum, cycle_count, run_ms, error_ms, maintenance_ms, idle_ms, occurrences, duration_ms_sum, duration_ms_max, severity, lane]
    door_events:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, opened_at_ms, closed_at_ms, duration_ms, order_id, fault_reset_during, fault_reset_count, first_reset_at_ms, last_reset_at_ms, ms_to_first_reset, state_at_open, step_at_open, state_at_close, step_at_close, opened_in_error, recipe_id, is_production, cycle_result, date_utc]
    fault_events:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, raised_at_ms, cleared_at_ms, downtime_ms, order_id, fault_key, fault_type, severity, recovered, recovery_at_ms, state, step, step_title, message, dwell_seq_index, recipe_id, is_production, cycle_result, cycle_started_at_ms, bucket_1m_ms, bucket_5m_ms, bucket_15m_ms, date_utc]
    gaps:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, started_at_ms, ended_at_ms, duration_ms, order_id, reason, version, source_branch]
    sensor_toggles:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, event_at_ms, order_id, src_id, input_id, input_name, value_from, value_to, current_state, current_step, is_production, bucket_1m_ms, bucket_5m_ms, bucket_15m_ms, date_utc]
    state_durations:
      strategy: telemetry
      ts_column: event_ts
      include_columns: [id, event_ts, entered_at_ms, exited_at_ms, duration_ms, order_id, state, entry_reason, exit_reason, is_downtime, is_production, date_utc]
    step_dwells:
      strategy: telemetry
      ts_column: event_ts
      # step_title now ships: it is a few hundred distinct strings repeated across every
      # row, which compresses to almost nothing, and withholding it forced the dashboard to
      # keep its own copy of the firmware's step map — a copy that drifts the first time a
      # step is renamed.
      #
      # Deliberately NOT shipped, though the replica keeps them all:
      #   sensors_start_json / sensors_end_json  ~820 B/row and identical on 99.7% of rows;
      #                                          fsm_events.sensors_bits carries sensor state
      #   sensors_trace_json / actuators_json    empty on nearly every row; step_actuators
      #                                          already carries the flattened actuator data
      #   step_title                             derived client-side from (state, step) via
      #                                          fsm-step-metadata.ts getStepTitle()
      # Together these were ~95% of the row. Without them omega outruns the projector instead
      # of falling further behind it.
      include_columns: [id, event_ts, started_at_ms, ended_at_ms, duration_ms, order_id, lane, state, step, step_title, seq_index, previous_state, previous_step, event_count, io_event_count, transition_count, fault_count, sensors_start_bits, sensors_end_bits, door_closed, cip_bypass, source_kind, fault_type, fault_message, recipe_id, is_production, cycle_result, cycle_started_at_ms, bucket_1m_ms, bucket_5m_ms, bucket_15m_ms, date_utc]